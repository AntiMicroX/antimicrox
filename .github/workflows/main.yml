name: Build

concurrency:
    group: build-${{ github.head_ref }}
    cancel-in-progress: true

on:
    push:
        branches:
            - master
    pull_request:
        branches:
            - master
    workflow_dispatch:

jobs:
    # Build job for Ubuntu
    build-ubuntu:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: Ubuntu 24-04 GCC QT6
                      image: ubuntu-24.04
                      cc: gcc
                      cxx: g++
                      build-type: Debug
                      experimental: false
                      qt-packages: "qt6-base-dev qt6-tools-dev qt6-tools-dev-tools libqt6core5compat6-dev qt6-l10n-tools linguist-qt6"
                    - name: Ubuntu 24-04 Clang QT6 (Used by AppImage)
                      image: ubuntu-24.04
                      cc: clang
                      cxx: clang++
                      build-type: Debug
                      experimental: true
                      qt-packages: "qt6-base-dev qt6-tools-dev qt6-tools-dev-tools libqt6core5compat6-dev qt6-l10n-tools linguist-qt6"

        name: ${{ matrix.name }} ${{ matrix.build-type }}
        runs-on: ${{ matrix.image }}
        continue-on-error: ${{ matrix.experimental }}

        steps:
            - uses: actions/checkout@v4

            - name: Install Dependencies
              run: sudo apt-get update && sudo apt-get install extra-cmake-modules libsdl2-dev libxi-dev libxtst-dev libx11-dev itstool gettext ninja-build ${{ matrix.qt-packages }}

            - name: Configure CMake
              run: cmake -GNinja -DCHECK_FOR_UPDATES=ON -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} -B ${{ github.workspace }}/build
              env:
                  CXX: ${{ matrix.cxx }}
                  CC: ${{ matrix.cc }}

            - name: Build AntiMicroX
              run: cmake --build ${{ github.workspace }}/build

    # Build job for Windows
    build-windows:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: WinServer2022 MinGW QT6
                      image: windows-2022
                      qt-version: "6.10"
                      shell: msys2 {0}
                      cmake-args: -G Ninja
                      build-type: Debug
                      qt-arch: "win64_mingw"
                      experimental: false
                    - name: WinServer2022 MSVC QT6
                      image: windows-2022
                      qt-version: "6.10"
                      shell: cmd
                      cmake-args: -G Ninja "-DSDL2_PATH=%WORKSPACE_DIR%/sdl2/" "-DSDL2_LIBRARY=%WORKSPACE_DIR%/sdl2/lib/x64/SDL2.lib" "-DSDL2_INCLUDE_DIR=%WORKSPACE_DIR%/sdl2/" "-DSDL2_DLL_LOCATION_DIR=%WORKSPACE_DIR%/sdl2/lib/x64/SDL2.dll"
                      build-type: Debug
                      qt-arch: "win64_msvc2022_64"
                      experimental: false
        name: ${{ matrix.name }} ${{ matrix.build-type }}
        runs-on: ${{ matrix.image }}
        continue-on-error: ${{ matrix.experimental }}
        defaults:
            run:
                shell:  ${{ matrix.shell }}

        steps:
            - uses: actions/checkout@v4

            - name: Install Dependencies (msys2)
              if: startsWith(matrix.shell, 'msys2')
              uses: msys2/setup-msys2@v2
              with:
                  install: >-
                      mingw-w64-x86_64-toolchain
                      mingw-w64-x86_64-ninja
                      mingw-w64-x86_64-cmake
                      mingw-w64-x86_64-SDL2
                  msystem: mingw64
                  release: false
            
            - name: Install sdl2 (msvc)
              if: startsWith(matrix.shell, 'cmd')
              run: |
                curl -L -o SDL2-devel-2.32.10-VC.zip https://github.com/libsdl-org/SDL/releases/download/release-2.32.10/SDL2-devel-2.32.10-VC.zip
                unzip SDL2-devel-2.32.10-VC.zip
                mv "${{ github.workspace }}/SDL2-2.32.10" "${{ github.workspace }}/sdl2"
                mklink /J "${{ github.workspace }}\sdl2\SDL2" "${{ github.workspace }}\sdl2\include"
              
            - name: Install MSVC
              if: startsWith(matrix.shell, 'cmd')
              uses: TheMrMilchmann/setup-msvc-dev@v3
              with:
                arch: x64
                toolset: 14

            # Pin Python 3.14 so py7zr uses prebuilt wheels instead of compiling from source on 3.15
            # before install-qt-action checks its cache:
            # https://github.com/jurplel/install-qt-action/issues/302
            # https://github.com/jurplel/install-qt-action/issues/304
            - name: Setup Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.14"

            - name: Install Qt
              uses: jurplel/install-qt-action@v4
              with:
                  version: ${{ matrix.qt-version }}
                  host: "windows"
                  target: "desktop"
                  arch: ${{ matrix.qt-arch }}
                  dir: "${{ github.workspace }}/qt/"
                  install-deps: "true"
                  cache: "true"
                  setup-python: "false"
              
            - name: Configure CMake
              run: cmake -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} -B "${{ github.workspace }}/build" ${{ matrix.cmake-args }}
              env:
                  CMAKE_PREFIX_PATH: "${{ env.QT_ROOT_DIR }}/lib/cmake"
                  WORKSPACE_DIR: ${{ github.workspace }}
              
            - name: Build
              run: cmake --build "${{ github.workspace }}/build" --parallel 8
